# 业务错误码表（共同事实源）
# Java 与 Python 两个后端必须返回一致的错误码、HTTP 状态码与语义。
# 核心错误码见 PRODUCT.md §11.2，本文件为可机读定义。
error-codes:
  SESSION_EXPIRED:
    http_status: 401
    message: 会话已过期，请重新登录
  WECHAT_CODE_INVALID:
    http_status: 401
    message: 微信登录凭证无效或已过期
  INVALID_CREDENTIALS:
    http_status: 401
    message: 用户名或密码错误
  AGREEMENT_NOT_ACCEPTED:
    http_status: 403
    message: 未确认用户协议，禁止发布/留言/认领
  ACCOUNT_RESTRICTED:
    http_status: 403
    message: 账户处于限制状态，禁止发布/留言/认领
  OPERATOR_REQUIRED:
    http_status: 403
    message: 无运营管理权限
  VALIDATION_FAILED:
    http_status: 422
    message: 参数校验失败
  VERIFICATION_CODE_INVALID:
    http_status: 422
    message: 验证码错误或已过期
  NOT_FOUND:
    http_status: 404
    message: 资源不存在或无权访问
  INVALID_STATE_TRANSITION:
    http_status: 409
    message: 非法状态迁移
  CLAIM_DUPLICATE:
    http_status: 409
    message: 同一物品已存在进行中的申请
  POST_NOT_CLAIMABLE:
    http_status: 409
    message: 信息当前不可申请认领
  CLUE_NOT_ALLOWED:
    http_status: 409
    message: 仅展示中的寻物信息可提交线索
  HANDOVER_CONFLICT:
    http_status: 409
    message: 已有申请进入待交接
  BLOCKED:
    http_status: 403
    message: 已被对方拉黑，无法继续发送消息或申请
  HANDOVER_ALREADY_EXISTS:
    http_status: 409
    message: 该申请已存在交接安排
  RATE_LIMITED:
    http_status: 429
    message: 操作过于频繁，请稍后再试
  CLAIM_RATE_LIMITED:
    http_status: 429
    message: 认领申请过于频繁，请稍后再试
  INTERNAL_ERROR:
    http_status: 500
    message: 服务内部错误
