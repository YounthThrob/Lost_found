# 业务错误码表（共同事实源）
# Java 与 Python 两个后端必须返回一致的错误码、HTTP 状态码与语义。
# 核心错误码见 PRODUCT.md §11.2，本文件为可机读定义。
error-codes:
  SESSION_EXPIRED:
    http_status: 401
    message: 会话已过期，请重新登录
  WECHAT_CODE_INVALID:
    http_status: 401
    message: 微信登录凭证无效或已过期
  AGREEMENT_NOT_ACCEPTED:
    http_status: 403
    message: 未确认用户协议，禁止发布/留言/认领
  VALIDATION_FAILED:
    http_status: 422
    message: 参数校验失败
  NOT_FOUND:
    http_status: 404
    message: 资源不存在或无权访问
  INVALID_STATE_TRANSITION:
    http_status: 409
    message: 非法状态迁移
  INTERNAL_ERROR:
    http_status: 500
    message: 服务内部错误
