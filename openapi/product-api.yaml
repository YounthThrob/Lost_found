openapi: 3.1.0
info:
  title: 校园失物招领互助平台 API
  version: 0.1.0
  description: 非官方校园失物招领互助平台。Java 与 Python 两个后端必须共同实现本契约。
servers:
  - url: /api/v1
paths:
  /session/wechat:
    post:
      summary: 微信登录或刷新平台会话
      operationId: wechatLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
                  description: wx.login 获取的临时登录凭证
      responses:
        "200":
          description: 登录成功，返回会话凭证
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: 微信 code 无效或已过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /me:
    get:
      summary: 查询当前用户
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 当前用户信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: 会话无效或已过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /me/agreement:
    post:
      summary: 确认用户协议与非官方风险提示
      operationId: confirmAgreement
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 确认成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgreementResponse"
        "401":
          description: 会话无效或已过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /me/campus-profile:
    get:
      summary: 查询当前用户自报学校与校区
      operationId: getCampusProfile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 自报学校与校区（未设置时 school/campus 为 null）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampusProfileResponse"
        "401":
          description: 会话无效或已过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      summary: 设置或更新自报学校与校区
      operationId: putCampusProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampusProfileUpdate"
      responses:
        "200":
          description: 更新成功，返回自报学校与校区
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampusProfileResponse"
        "401":
          description: 会话无效或已过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: 学校为空或超长等参数校验失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /posts:
    get:
      summary: 搜索与筛选已发布信息
      operationId: searchPosts
      security:
        - bearerAuth: []
      parameters:
        - name: keyword
          in: query
          required: false
          schema:
            type: string
          description: 关键词，对标题与公开描述做包含匹配
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [LOST, FOUND]
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: school
          in: query
          required: false
          schema:
            type: string
        - name: campus
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: 已发布信息列表（分页）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemPostListResponse"
        "401":
          description: 会话无效或已过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: 分页参数非法
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      summary: 创建寻物或招领草稿
      operationId: createPost
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemPostCreate"
      responses:
        "200":
          description: 创建成功，返回草稿
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemPostResponse"
        "401":
          description: 会话无效或已过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 未确认用户协议
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: 参数校验失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /posts/{postId}:
    get:
      summary: 查看信息详情
      operationId: getPost
      security:
        - bearerAuth: []
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 信息详情（已发布对所有人可见，非已发布仅作者可见）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemPostResponse"
        "401":
          description: 会话无效或已过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 信息不存在或无权访问
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      summary: 编辑草稿
      operationId: updatePost
      security:
        - bearerAuth: []
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemPostUpdate"
      responses:
        "200":
          description: 编辑成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemPostResponse"
        "401":
          description: 会话无效或已过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 未确认用户协议
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 信息不存在或无权访问
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: 非法状态迁移（非草稿不可编辑）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: 参数校验失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /posts/{postId}/publish:
    post:
      summary: 提交发布
      operationId: publishPost
      security:
        - bearerAuth: []
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 发布成功，状态为 PUBLISHED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemPostResponse"
        "401":
          description: 会话无效或已过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 未确认用户协议
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 信息不存在或无权访问
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: 非法状态迁移（仅草稿可发布）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /posts/{postId}/close:
    post:
      summary: 主动关闭已发布信息
      operationId: closePost
      security:
        - bearerAuth: []
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 关闭成功，状态为 CLOSED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemPostResponse"
        "401":
          description: 会话无效或已过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 未确认用户协议
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 信息不存在或无权访问
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: 非法状态迁移（仅已发布可关闭）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LoginResponse:
      type: object
      required:
        - data
        - requestId
        - timestamp
      properties:
        data:
          type: object
          required:
            - token
            - agreementAccepted
          properties:
            token:
              type: string
            agreementAccepted:
              type: boolean
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
    MeResponse:
      type: object
      required:
        - data
        - requestId
        - timestamp
      properties:
        data:
          type: object
          required:
            - id
            - status
            - agreementAccepted
          properties:
            id:
              type: string
            status:
              type: string
            agreementAccepted:
              type: boolean
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
    AgreementResponse:
      type: object
      required:
        - data
        - requestId
        - timestamp
      properties:
        data:
          type: object
          required:
            - agreementAccepted
          properties:
            agreementAccepted:
              type: boolean
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
    CampusProfileUpdate:
      type: object
      required:
        - school
      properties:
        school:
          type: string
          description: 自报学校（必填，非空，≤100 字符）
        campus:
          type: ["string", "null"]
          description: 自报校区（可选，≤100 字符）
    CampusProfileResponse:
      type: object
      required:
        - data
        - requestId
        - timestamp
      properties:
        data:
          type: object
          required:
            - verificationStatus
          properties:
            school:
              type: ["string", "null"]
            campus:
              type: ["string", "null"]
            verificationStatus:
              type: string
              enum:
                - SELF_DECLARED
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
    ItemPostCreate:
      type: object
      required:
        - type
        - category
        - title
        - publicDescription
        - school
      properties:
        type:
          type: string
          enum: [LOST, FOUND]
          description: LOST=寻物，FOUND=招领
        category:
          type: string
          description: 物品分类（非空，≤50 字符）
        title:
          type: string
          description: 标题（非空，≤100 字符）
        publicDescription:
          type: string
          description: 公开描述（非空，≤2000 字符）
        school:
          type: string
          description: 学校（非空，≤100 字符）
        campus:
          type: ["string", "null"]
          description: 校区（可选，≤100 字符）
        area:
          type: ["string", "null"]
          description: 模糊区域（可选，≤100 字符）
    ItemPostUpdate:
      type: object
      required:
        - type
        - category
        - title
        - publicDescription
        - school
      properties:
        type:
          type: string
          enum: [LOST, FOUND]
        category:
          type: string
        title:
          type: string
        publicDescription:
          type: string
        school:
          type: string
        campus:
          type: ["string", "null"]
        area:
          type: ["string", "null"]
    ItemPostView:
      type: object
      required:
        - id
        - type
        - category
        - title
        - publicDescription
        - school
        - status
        - authorId
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        type:
          type: string
          enum: [LOST, FOUND]
        category:
          type: string
        title:
          type: string
        publicDescription:
          type: string
        school:
          type: string
        campus:
          type: ["string", "null"]
        area:
          type: ["string", "null"]
        status:
          type: string
          enum: [DRAFT, PENDING_REVIEW, PUBLISHED, CLOSED]
        authorId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Pagination:
      type: object
      required:
        - page
        - pageSize
        - total
        - hasMore
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        hasMore:
          type: boolean
    ItemPostListData:
      type: object
      required:
        - items
        - pagination
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ItemPostView"
        pagination:
          $ref: "#/components/schemas/Pagination"
    ItemPostResponse:
      type: object
      required:
        - data
        - requestId
        - timestamp
      properties:
        data:
          $ref: "#/components/schemas/ItemPostView"
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
    ItemPostListResponse:
      type: object
      required:
        - data
        - requestId
        - timestamp
      properties:
        data:
          $ref: "#/components/schemas/ItemPostListData"
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      required:
        - error
        - requestId
        - timestamp
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
