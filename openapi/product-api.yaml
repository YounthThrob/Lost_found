      properties:
        schoolId:
          type: string
          description: 学校标识（必填，须为目录中已启用学校）
        campusId:
          type: ["string", "null"]
          description: 校区标识（可选，须属于该学校且已审核通过）
    CampusProfileResponse:
      type: object
      required:
        - data
        - requestId
        - timestamp
      properties:
        data:
          type: object
          required:
            - verificationStatus
          properties:
            schoolId:
              type: ["string", "null"]
              description: 学校标识（未设置为 null）
            schoolName:
              type: ["string", "null"]
              description: 学校名称（未设置为 null）
            campusId:
              type: ["string", "null"]
              description: 校区标识（未设置为 null）
            campusName:
              type: ["string", "null"]
              description: 校区名称（未设置为 null）
            verificationStatus:
              type: string
              enum:
                - SELF_DECLARED
                - EMAIL_VERIFIED
            verifiedEmail:
              type: ["string", "null"]
              description: 已核验校园邮箱（未核验为 null）
            emailVerifiedAt:
              type: ["string", "null"]
              format: date-time
              description: 邮箱核验完成时间（RFC3339 UTC，未核验为 null）
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
    EmailVerificationSend:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          description: 校园邮箱（非空，≤100 字符，符合邮箱格式）
