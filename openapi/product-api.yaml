openapi: 3.1.0
info:
  title: 校园失物招领互助平台 API
  version: 0.1.0
  description: 非官方校园失物招领互助平台。Java 与 Python 两个后端必须共同实现本契约。
servers:
  - url: /api/v1
paths:
  /session/wechat:
    post:
      summary: 微信登录或刷新平台会话
      operationId: wechatLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
                  description: wx.login 获取的临时登录凭证
      responses:
        "200":
          description: 登录成功，返回会话凭证
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: 微信 code 无效或已过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /me:
    get:
      summary: 查询当前用户
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 当前用户信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: 会话无效或已过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /me/agreement:
    post:
      summary: 确认用户协议与非官方风险提示
      operationId: confirmAgreement
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 确认成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgreementResponse"
        "401":
          description: 会话无效或已过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /me/profile:
    put:
      summary: 设置或更新用户昵称
      operationId: putProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: 更新成功，返回昵称与头像地址
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
        "401":
          description: 会话无效或已过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: 昵称校验失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /me/avatar:
    post:
      summary: 上传用户头像
      operationId: uploadAvatar
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: 头像图片（jpeg/png/webp，≤10MB）
      responses:
        "200":
          description: 上传成功，返回头像地址
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvatarResponse"
        "401":
          description: 会话无效或已过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: 头像类型/大小校验失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /me/campus-profile:
    get:
      summary: 查询当前用户自报学校与校区
      operationId: getCampusProfile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 自报学校与校区（未设置时 schoolId/campusId 为 null）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampusProfileResponse"
        "401":
          description: 会话无效或已过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      summary: 设置或更新自报学校与校区
      operationId: putCampusProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampusProfileUpdate"
      responses:
        "200":
          description: 更新成功，返回自报学校与校区
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampusProfileResponse"
        "401":
          description: 会话无效或已过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: 学校为空或超长等参数校验失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /me/campus-verification/email:
    post:
      summary: 发起校园邮箱核验（发送验证码）
      operationId: sendCampusEmailVerification
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailVerificationSend"
      responses:
        "200":
          description: 验证码已发送（mock）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailVerificationSendResponse"
        "401":
          description: 会话无效或已过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: 邮箱格式非法或域名不允许
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /me/campus-verification/email/confirm:
    post:
      summary: 确认验证码并完成校园邮箱核验
      operationId: confirmCampusEmailVerification
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailVerificationConfirm"
      responses:
        "200":
          description: 核验成功，返回核验后的校园档案
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampusProfileResponse"
        "401":
          description: 会话无效或已过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: 验证码错误或已过期（VERIFICATION_CODE_INVALID）或参数校验失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /directory/schools:
    get:
      summary: 查询学校目录
      operationId: searchSchools
      security:
        - bearerAuth: []
      parameters:
        - name: keyword
          in: query
          required: false
          schema:
            type: string
          description: 学校名称或别名关键词
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: 学校目录列表（分页）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchoolListResponse"
        "401":
          description: 会话无效或已过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: 分页参数非法
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /directory/schools/{schoolId}/campuses:
    get:
      summary: 查询学校校区
      operationId: listCampuses
      security:
        - bearerAuth: []
      parameters:
        - name: schoolId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 该校已审核通过（ACTIVE）的校区列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampusListResponse"
        "401":
          description: 会话无效或已过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 学校不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      summary: 申请新增校区
      operationId: requestCampus
      security:
        - bearerAuth: []
      parameters:
        - name: schoolId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampusCreate"
      responses:
        "200":
          description: 申请成功，校区进入 PENDING
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampusResponse"
        "401":
          description: 会话无效或已过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 学校不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: 校区重名或名称非法
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/campuses/{campusId}/review:
    post:
      summary: 运营审核校区申请
      operationId: reviewCampus
      security:
        - bearerAuth: []
      parameters:
        - name: campusId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampusReview"
      responses:
        "200":
          description: 审核完成，校区状态为 ACTIVE 或 REJECTED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampusResponse"
        "401":
          description: 会话无效或已过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 无运营管理权限
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 校区不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: 参数校验失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /posts:
    get:
      summary: 搜索与筛选已发布信息
      operationId: searchPosts
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: keyword
          in: query
          required: false
          schema:
            type: string
          description: 关键词，对标题与公开描述做包含匹配
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [LOST, FOUND]
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: schoolId
          in: query
          required: false
          schema:
            type: string
        - name: campusId
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: 已发布信息列表（分页）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemPostListResponse"
        "422":
          description: 分页参数非法
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      summary: 创建寻物或招领草稿
      operationId: createPost
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemPostCreate"
      responses:
        "200":
          description: 创建成功，返回草稿
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemPostResponse"
        "401":
          description: 会话无效或已过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 未确认用户协议
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: 参数校验失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /stats:
    get:
      summary: 查询广场统计（招领/寻物数量与今日已交接数量）
      operationId: getStats
      security:
        - {}
        - bearerAuth: []
      responses:
        "200":
          description: 公开统计（招领数、寻物数、今日找到方向数）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsResponse"
  /posts/{postId}:
    get:
      summary: 查看信息详情
      operationId: getPost
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 信息详情（已发布对所有人可见，非已发布仅作者可见）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemPostResponse"
        "404":
          description: 信息不存在或无权访问
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      summary: 编辑草稿
      operationId: updatePost
      security:
        - bearerAuth: []
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemPostUpdate"
      responses:
        "200":
          description: 编辑成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemPostResponse"
        "401":
          description: 会话无效或已过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 未确认用户协议
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 信息不存在或无权访问
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: 非法状态迁移（非草稿不可编辑）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: 参数校验失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /posts/{postId}/images:
    post:
      summary: 为草稿信息上传图片
      operationId: uploadPostImage
      security:
        - bearerAuth: []
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: 图片文件（jpeg/png/webp，≤10MB）
      responses:
        "200":
          description: 上传成功，返回图片元数据
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemImageResponse"
        "401":
          description: 会话无效或已过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 未确认用户协议
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 信息不存在或非作者
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: 非法状态迁移（非草稿不可上传）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: 图片类型/大小/数量校验失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /posts/{postId}/images/{imageId}:
    delete:
      summary: 删除草稿信息中的图片
      operationId: deletePostImage
      security:
        - bearerAuth: []
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: string
        - name: imageId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyResponse"
        "401":
          description: 会话无效或已过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 未确认用户协议
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 信息或图片不存在，或非作者
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: 非法状态迁移（非草稿不可删除）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /posts/{postId}/publish:
    post:
      summary: 提交发布
      operationId: publishPost
      security:
        - bearerAuth: []
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 发布成功，状态为 PUBLISHED 或 REJECTED（命中违禁词）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemPostResponse"
        "401":
          description: 会话无效或已过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 未确认用户协议
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 信息不存在或无权访问
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: 非法状态迁移（仅草稿可发布）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /posts/{postId}/close:
    post:
      summary: 主动关闭已发布信息
      operationId: closePost
      security:
        - bearerAuth: []
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 关闭成功，状态为 CLOSED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemPostResponse"
        "401":
          description: 会话无效或已过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 未确认用户协议
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 信息不存在或无权访问
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: 非法状态迁移（仅已发布可关闭）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /reports:
    post:
      summary: 提交举报
      operationId: createReport
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportCreate"
      responses:
        "200":
          description: 举报提交成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportResponse"
        "401":
          description: 会话无效或已过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: 参数校验失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /reports/me:
    get:
      summary: 查看我的举报
      operationId: listMyReports
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: 我的举报列表（分页）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportListResponse"
        "401":
          description: 会话无效或已过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: 分页参数非法
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /posts/{postId}/claims:
    post:
      summary: 提交认领申请
      operationId: createClaim
      security:
        - bearerAuth: []
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimCreate"
      responses:
        "200":
          description: 申请提交成功，status 为 SUBMITTED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimResponse"
        "401":
          description: 会话无效或已过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 未确认用户协议
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 信息不存在或无权访问
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
