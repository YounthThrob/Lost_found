                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 会话不存在或无权访问
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: 申请尚未接受（INVALID_STATE_TRANSITION）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: 消息类型或内容非法
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /handovers:
    post:
      summary: 创建交接安排
      operationId: createHandover
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HandoverCreate"
      responses:
        "200":
          description: 创建成功，status 为 PENDING
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HandoverResponse"
        "401":
          description: 会话无效或已过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 未确认用户协议
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 申请不存在或无权访问
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: 申请未接受或已存在交接安排（INVALID_STATE_TRANSITION / HANDOVER_ALREADY_EXISTS）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: 时间窗口或公共区域为空或超长
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /handovers/{handoverId}/confirm:
    post:
      summary: 当前用户确认交接完成
      operationId: confirmHandover
      security:
        - bearerAuth: []
      parameters:
        - name: handoverId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 确认成功，返回更新后的交接
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HandoverResponse"
        "401":
          description: 会话无效或已过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 交接不存在或无权访问
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: 非法状态迁移（仅 PENDING 可确认）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /handovers/{handoverId}/cancel:
    post:
      summary: 终止交接
      operationId: cancelHandover
      security:
        - bearerAuth: []
      parameters:
        - name: handoverId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 终止成功，返回更新后的交接
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HandoverResponse"
        "401":
          description: 会话无效或已过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 交接不存在或无权访问
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: 非法状态迁移（仅 PENDING 可终止）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LoginResponse:
      type: object
      required:
        - data
        - requestId
        - timestamp
      properties:
        data:
          type: object
          required:
            - token
            - agreementAccepted
          properties:
            token:
              type: string
            agreementAccepted:
              type: boolean
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
    MeResponse:
      type: object
      required:
        - data
        - requestId
        - timestamp
      properties:
        data:
          type: object
          required:
            - id
            - status
            - agreementAccepted
            - nickname
            - avatarUrl
          properties:
            id:
              type: string
            status:
              type: string
            agreementAccepted:
              type: boolean
            nickname:
              type: ["string", "null"]
              description: 用户昵称（未设置为 null）
            avatarUrl:
              type: ["string", "null"]
              description: 头像地址（未设置为 null）
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
    ProfileUpdate:
      type: object
      required:
        - nickname
      properties:
        nickname:
          type: string
          description: 用户昵称（非空，≤30 字符）
    ProfileResponse:
      type: object
      required:
        - data
        - requestId
        - timestamp
      properties:
        data:
          type: object
          required:
            - nickname
            - avatarUrl
          properties:
            nickname:
              type: ["string", "null"]
            avatarUrl:
              type: ["string", "null"]
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
    AvatarResponse:
      type: object
      required:
        - data
        - requestId
        - timestamp
      properties:
        data:
          type: object
          required:
            - avatarUrl
          properties:
            avatarUrl:
              type: string
              description: 头像地址（/media/{storage_key}）
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
    AgreementResponse:
      type: object
      required:
        - data
        - requestId
        - timestamp
      properties:
        data:
          type: object
          required:
            - agreementAccepted
          properties:
            agreementAccepted:
              type: boolean
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
    SchoolView:
      type: object
      required:
        - id
        - name
        - aliases
      properties:
        id:
          type: string
        name:
          type: string
          description: 学校正式名称
        aliases:
          type: array
          items:
            type: string
          description: 学校别名
    SchoolListData:
      type: object
      required:
        - items
        - pagination
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SchoolView"
        pagination:
          $ref: "#/components/schemas/Pagination"
    SchoolListResponse:
      type: object
      required:
        - data
        - requestId
        - timestamp
      properties:
        data:
          $ref: "#/components/schemas/SchoolListData"
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
    CampusView:
      type: object
      required:
        - id
        - schoolId
        - name
        - status
      properties:
        id:
          type: string
        schoolId:
          type: string
        name:
          type: string
          description: 校区名称
        status:
          type: string
          enum: [PENDING, ACTIVE, REJECTED]
    CampusListData:
      type: object
      required:
        - items
        - pagination
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CampusView"
        pagination:
          $ref: "#/components/schemas/Pagination"
    CampusListResponse:
      type: object
      required:
        - data
