[project]
name = "backend-python"
version = "0.1.0"
description = "校园失物招领互助平台 Python 后端（FastAPI）"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "PyJWT>=2.8",
    "httpx>=0.27",
    "pydantic>=2.6",
    "python-multipart>=0.0.9",
    "bcrypt>=4.1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
