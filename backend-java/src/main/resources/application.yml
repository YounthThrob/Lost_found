server:
  port: 8080

spring:
  application:
    name: backend-java
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

# 微信登录配置。生产环境通过环境变量覆盖，密钥不进版本库。
wechat:
  mock: ${WECHAT_MOCK:true}
  appid: ${WECHAT_APPID:}
  secret: ${WECHAT_SECRET:}

# 运营账号（仅用于运营账号密码登录；密码仅以 bcrypt 哈希存储）。
operator:
  username: ${OPERATOR_USERNAME:admin}
  password: ${OPERATOR_PASSWORD:admin123}

# JWT 会话配置。HS256 要求密钥长度 >= 32 字节。
jwt:
  secret: ${JWT_SECRET:dev-only-secret-key-please-change-0123456789}
  ttl-seconds: ${JWT_TTL_SECONDS:7200}

# CORS：允许的运营后台来源（逗号分隔），生产环境通过环境变量覆盖，禁用通配来源。
cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# 校园邮箱核验域名白名单（逗号分隔，为空表示不限制）。
campus-email-domains: ${CAMPUS_EMAIL_DOMAINS:}

# 图片本地存储目录。
storage:
  local-dir: ${STORAGE_LOCAL_DIR:./data/media}
